---
- name: Instalar y configurar MariaDB
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  roles:
    - install_mariadb

  tasks:

    - name: Crear base de datos
      ansible.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: present
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        config_file: ""

    - name: Crear tabla cumpleanios
      ansible.mysql.mysql_query:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        config_file: ""
        query: |
          CREATE TABLE IF NOT EXISTS cumpleanios (
            id INT AUTO_INCREMENT PRIMARY KEY,
            nombre VARCHAR(100) NOT NULL,
            fecha DATE NOT NULL,
            UNIQUE KEY unique_cumpleanios (nombre, fecha)
          );
      changed_when: false

    - name: Cargar datos iniciales
      ansible.mysql.mysql_query:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        config_file: ""
        query: |
          INSERT IGNORE INTO cumpleanios (nombre, fecha)
          VALUES
            ('Frodo Baggins', '2005-01-14'),
            ('Aragorn', '2004-02-09'),
            ('Arwen Undomiel', '1995-12-09');
      register: insert_result
      changed_when: insert_result.rowcount[0] > 0

    - name: Crear usuario de la aplicacion
      ansible.mysql.mysql_user:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        config_file: ""
        name: "{{ DB_USER }}"
        host: "%"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:SELECT,INSERT,UPDATE,DELETE"
        state: present

