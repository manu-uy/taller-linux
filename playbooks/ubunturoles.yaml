---
- name: Configurar servidor de base de datos
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  roles:
    - install_mariadb

  tasks:

    - name: Crear base de datos
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: present
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Crear tabla de cumpleaños
      community.mysql.mysql_query:
        login_db: "{{ DB_DBASE }}"
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          CREATE TABLE IF NOT EXISTS cumpleanios (
            id INT AUTO_INCREMENT PRIMARY KEY,
            nombre VARCHAR(100),
            fecha DATE
          );
        config_file: ""
      changed_when: false

    - name: Insertar datos iniciales
      community.mysql.mysql_query:
        login_db: "{{ DB_DBASE }}"
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query:
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Frodo Baggins', '2005-01-14'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Frodo Baggins'
                AND fecha = '2005-01-14'
            );
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Aragorn', '2004-02-09'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Aragorn'
                AND fecha = '2004-02-09'
            );
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Arwen Undomiel', '1994-12-09'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Arwen Undomiel'
                AND fecha = '1994-12-09'
            );
      register: datos_iniciales
      changed_when: >
        datos_iniciales.rowcount | map('int') | sum > 0

    - name: Crear usuario de la aplicacion
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        host: "{{ app_server_ip }}"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:SELECT,INSERT,UPDATE,DELETE"
        state: present
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
