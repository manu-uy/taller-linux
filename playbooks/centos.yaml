---
- name: Configurar servidor web
  hosts: centos01
  become: true

  vars_files:
    - ../vars/database.yaml

  vars:
    packages:
      - httpd
      - php
      - php-fpm
      - php-mysqlnd
      - python3-libsemanage

  tasks:

    - name: Instalar Apache, PHP y dependencias
      ansible.builtin.dnf:
        name: "{{ packages }}"
        state: present

    - name: Asegurar que Apache este iniciado y habilitado
      ansible.builtin.systemd_service:
        name: httpd
        state: started
        enabled: true

    - name: Asegurar que PHP-FPM este iniciado y habilitado
      ansible.builtin.systemd_service:
        name: php-fpm
        state: started
        enabled: true

    - name: Permitir HTTP en firewalld
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true

    - name: Desplegar aplicacion PHP
      ansible.builtin.template:
        src: ../templates/cumple.j2
        dest: /var/www/html/index.php
        owner: apache
        group: apache
        mode: "0644"

    - name: Permitir conexiones de Apache hacia la red
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Permitir conexiones de Apache hacia la base de datos
      ansible.posix.seboolean:
        name: httpd_can_network_connect_db
        state: true
        persistent: true
