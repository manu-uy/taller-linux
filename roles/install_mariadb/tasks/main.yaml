---
- name: Instalar MariaDB y dependencias para Ansible
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true

- name: Configurar MariaDB para aceptar conexiones remotas
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^\s*bind-address\s*='
    line: 'bind-address = 0.0.0.0'
    state: present
  notify: Reiniciar MariaDB

- name: Asegurar que MariaDB este iniciado y habilitado
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true

- name: Permitir MariaDB solamente desde el servidor de aplicacion
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "{{ app_server_ip }}"
