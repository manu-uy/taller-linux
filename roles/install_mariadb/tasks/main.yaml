---
- name: Instalar MariaDB y dependencias de Python
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Asociar MariaDB a todas las interfaces
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^\s*bind-address\s*='
    line: 'bind-address = 0.0.0.0'
    state: present
  notify: Reiniciar MariaDB

- name: Asegurar que MariaDB este iniciado
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true

- name: Permitir conexiones a MariaDB desde el servidor de aplicacion
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "10.0.2.15"
